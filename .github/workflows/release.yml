# A ogni aggiornamento dei file (li copia la compilazione del repository privato)
# pubblica la release della versione (tag vX.Y.Z): i link del README e del sito
# con "releases/latest" puntano sempre all'ultima.
name: release
on:
  push:
    branches: [main]
    paths: ['charlie26-*', 'VERSION', 'RELEASE_NOTES.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(tr -d ' \r\n' < VERSION)
          tag="v$ver"
          title="CHARLIE26 – Intercom Evoluto $ver"
          # Una release per ogni versione (tag vX.Y.Z): il sito legge da lì la
          # versione. L'ultima è quella che GitHub serve come "latest" nei link.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --latest --title "$title" --notes-file RELEASE_NOTES.md
          gh release edit "$tag" --latest --title "$title" --notes-file RELEASE_NOTES.md
          for f in charlie26-setup.exe charlie26-darwin-arm64 charlie26-darwin-amd64 charlie26-android.apk SHA256SUMS.txt; do
            if [ -f "$f" ]; then
              gh release upload "$tag" "$f" --clobber
            else
              gh release delete-asset "$tag" "$f" --yes 2>/dev/null || true
            fi
          done
          # La vecchia release chiamata "latest" (primo schema) non serve più.
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
